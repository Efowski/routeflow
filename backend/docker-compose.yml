services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: climber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Olus1enka
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: